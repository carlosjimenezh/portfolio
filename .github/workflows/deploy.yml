name: Deploy Astro to AWS

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ${{ secrets.AWS_REGION }}
  S3_BUCKET_NAME: ${{ secrets.S3_BUCKET_NAME }}
  DISTRIBUTION_ID: ${{ secrets.DISTRIBUTION_ID }}

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: 🔍 Debug OIDC
        uses: actions/github-script@v7
        with:
          script: |
            const token = await core.getIDToken();
            const payload = JSON.parse(
              Buffer.from(token.split('.')[1], 'base64url').toString()
            );

              console.log('OIDC claims:');
              console.log(JSON.stringify({
                iss: payload.iss,
                aud: payload.aud,
                sub: payload.sub,
                repository: payload.repository,
                ref: payload.ref,
                repository_id: payload.repository_id,
                repository_owner_id: payload.repository_owner_id
              }, null, 2));
      
      - name: 🧾 Checkout Repo
        uses: actions/checkout@v4
        
      - name: 📦 Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      

      - name: 📦 Install dependencies
        run: pnpm install --frozen-lockfile

      - name: 🏗️ Build Astro
        run: pnpm build

      - name: 🪄 Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::286879406269:role/deploy-portfolio
          aws-region: mx-central-1
          audience: sts.amazonaws.com

      - name: 📤 Sync dist to S3
        run: aws s3 sync ./dist s3://$S3_BUCKET_NAME --delete

      - name: 🚨 Invalidate CloudFront Cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id $DISTRIBUTION_ID \
            --paths "/*"
